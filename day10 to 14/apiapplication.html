<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravelMate</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                to right,
                #42d2a3,
                #1765a3
            );

            overflow-x: hidden;
            overflow-y: auto;
        }

        /* MAIN PAGE */

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 60px 20px;
        }

        /* SEARCH BOX */

        .search-container {
            width: 900px;
            max-width: 95%;
            margin: 40px auto 30px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.18);

            text-align: center;
        }

        .search-container h1 {
            color: #1765a3;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .search-container .subtitle {
            color: #555;
            font-size: 18px;
            margin-bottom: 25px;
        }

        /* SEARCH AREA */

        .search-box {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        #cityInput {
            flex: 1;

            padding: 15px;

            font-size: 17px;

            border: 1px solid #ccc;

            border-radius: 7px;

            outline: none;
        }

        #cityInput:focus {
            border-color: #1765a3;
        }

        #searchBtn {
            padding: 15px 25px;

            background: #000;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            cursor: pointer;
        }

        #searchBtn:hover {
            background: #1765a3;
        }

        /* STATUS */

        #status {
            text-align: center;

            color: white;

            font-size: 18px;

            margin: 20px auto;

            display: none;
        }

        /* RESULTS CONTAINER */

        #results {
            width: 1200px;
            max-width: 95%;

            margin: 30px auto 60px;

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 25px;

            align-items: stretch;
        }

        /* CITY TITLE */

        .city-title {
            grid-column: 1 / -1;

            background: white;

            padding: 20px;

            border-radius: 12px;

            text-align: center;

            color: #1765a3;

            font-size: 28px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);
        }

        /* PLACE CARD */

        .place-card {
            background: white;

            border-radius: 15px;

            overflow: hidden;

            box-shadow:
                0 5px 18px rgba(0, 0, 0, 0.15);

            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;

            display: flex;

            flex-direction: column;

            min-width: 0;
        }

        .place-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.22);
        }

        /* PLACE IMAGE */

        .place-image {
            width: 100%;

            height: 220px;

            object-fit: cover;

            display: block;

            background: #ddd;
        }

        /* CARD CONTENT */

        .place-content {
            padding: 20px;

            display: flex;

            flex-direction: column;

            flex: 1;
        }

        .place-name {
            color: #1765a3;

            font-size: 22px;

            line-height: 1.25;

            margin-bottom: 12px;
        }

        .category {
            color: #555;

            font-size: 15px;

            margin-bottom: 12px;
        }

        .address {
            color: #444;

            font-size: 15px;

            line-height: 1.4;

            margin-bottom: 18px;
        }

        /* MAP BUTTON */

        .map-button {
            display: inline-block;

            width: fit-content;

            margin-top: auto;

            background: #1765a3;

            color: white;

            text-decoration: none;

            padding: 11px 17px;

            border-radius: 6px;

            font-size: 15px;

            transition: background 0.2s ease;
        }

        .map-button:hover {
            background: #0d4f82;
        }

        /* NO RESULTS */

        .no-results {
            grid-column: 1 / -1;

            background: white;

            padding: 30px;

            border-radius: 12px;

            text-align: center;

            color: #555;

            font-size: 18px;
        }

        /* LOADING */

        .loading {
            text-align: center;

            color: white;

            font-size: 20px;

            margin-top: 30px;
        }

        .spinner {
            width: 35px;

            height: 35px;

            border: 4px solid rgba(255,255,255,0.4);

            border-top: 4px solid white;

            border-radius: 50%;

            animation: spin 1s linear infinite;

            margin: 15px auto;
        }

        @keyframes spin {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }

        }

        /* TABLET */

        @media (max-width: 900px) {

            #results {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        /* MOBILE */

        @media (max-width: 600px) {

            .page {
                padding: 25px 10px;
            }

            .search-container {
                margin-top: 20px;

                padding: 25px 18px;
            }

            .search-container h1 {
                font-size: 30px;
            }

            .search-container .subtitle {
                font-size: 16px;
            }

            .search-box {
                flex-direction: column;
            }

            #searchBtn {
                width: 100%;
            }

            #results {
                grid-template-columns: 1fr;
            }

            .city-title {
                font-size: 23px;
            }

        }

    </style>

</head>


<body>

    <div class="page">

        <!-- SEARCH SECTION -->

        <div class="search-container">

            <h1>TravelMate</h1>

            <p class="subtitle">
                Discover popular tourist places in any city
            </p>

            <div class="search-box">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name"
                    autocomplete="off"
                >

                <button id="searchBtn">
                    Search
                </button>

            </div>

        </div>


        <!-- STATUS -->

        <div id="status"></div>


        <!-- RESULTS -->

        <div id="results"></div>

    </div>


    <script>

        /* =========================================
           GEOAPIFY API KEY
           ========================================= */

        const API_KEY = "8de1a34fb394419f80852bd021a53963";


        /* =========================================
           GET HTML ELEMENTS
           ========================================= */

        const cityInput = document.getElementById("cityInput");

        const searchBtn = document.getElementById("searchBtn");

        const results = document.getElementById("results");

        const status = document.getElementById("status");


        /* =========================================
           SEARCH BUTTON
           ========================================= */

        searchBtn.addEventListener("click", function () {

            searchCity();

        });


        /* =========================================
           ENTER KEY
           ========================================= */

        cityInput.addEventListener("keydown", function (event) {

            if (event.key === "Enter") {

                searchCity();

            }

        });


        /* =========================================
           MAIN SEARCH FUNCTION
           ========================================= */

        async function searchCity() {

            const city = cityInput.value.trim();


            /* CHECK EMPTY INPUT */

            if (city === "") {

                alert("Please enter a city name.");

                return;

            }


            /* CLEAR OLD RESULTS */

            results.innerHTML = "";


            /* SHOW LOADING */

            status.style.display = "block";

            status.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    Searching for tourist places in ${escapeHTML(city)}...
                </div>
            `;


            try {

                /* =====================================
                   STEP 1: FIND CITY COORDINATES
                   ===================================== */

                const geoUrl =
                    `https://api.geoapify.com/v1/geocode/search?` +
                    `text=${encodeURIComponent(city)}` +
                    `&limit=1` +
                    `&format=json` +
                    `&apiKey=${API_KEY}`;


                const geoResponse = await fetch(geoUrl);


                if (!geoResponse.ok) {

                    throw new Error(
                        "Unable to connect to Geoapify."
                    );

                }


                const geoData = await geoResponse.json();


                /* CHECK CITY */

                if (
                    !geoData.results ||
                    geoData.results.length === 0
                ) {

                    throw new Error(
                        "City not found. Please enter a valid city name."
                    );

                }


                const location = geoData.results[0];


                const latitude = location.lat;

                const longitude = location.lon;


                const cityName =
                    location.city ||
                    location.name ||
                    city;


                /* =====================================
                   STEP 2: FIND TOURIST PLACES
                   ===================================== */

                const placesUrl =
                    `https://api.geoapify.com/v2/places?` +
                    `categories=tourism.sights,tourism.attraction` +
                    `&filter=circle:${longitude},${latitude},15000` +
                    `&bias=proximity:${longitude},${latitude}` +
                    `&limit=20` +
                    `&apiKey=${API_KEY}`;


                const placesResponse = await fetch(placesUrl);


                if (!placesResponse.ok) {

                    throw new Error(
                        "Unable to get tourist places."
                    );

                }


                const placesData =
                    await placesResponse.json();


                const places =
                    placesData.features || [];


                /* HIDE LOADING */

                status.style.display = "none";


                /* NO PLACES */

                if (places.length === 0) {

                    results.innerHTML = `
                        <div class="no-results">
                            <h2>No tourist places found</h2>

                            <p>
                                We couldn't find tourist attractions
                                near ${escapeHTML(cityName)}.
                            </p>
                        </div>
                    `;

                    return;

                }


                /* =====================================
                   CITY HEADING
                   ===================================== */

                results.innerHTML = `
                    <div class="city-title">
                        Tourist Places in ${escapeHTML(cityName)}
                    </div>
                `;


                /* =====================================
                   CREATE CARDS
                   ===================================== */

                for (const place of places) {

                    const properties =
                        place.properties || {};


                    /* PLACE NAME */

                    const placeName =
                        properties.name ||
                        properties.address_line1 ||
                        "Tourist Attraction";


                    /* CATEGORY */

                    let category =
                        properties.categories || [];


                    if (Array.isArray(category)) {

                        category =
                            category[category.length - 1] ||
                            "Tourist Place";

                    }


                    /* FORMAT CATEGORY */

                    category =
                        category
                            .replace("tourism.", "")
                            .replaceAll(".", " ")
                            .replaceAll("_", " ");


                    category =
                        category.charAt(0).toUpperCase() +
                        category.slice(1);


                    /* ADDRESS */

                    const address =
                        properties.formatted ||
                        properties.address_line2 ||
                        properties.address_line1 ||
                        "Address not available";


                    /* COORDINATES */

                    const lat =
                        properties.lat ||
                        place.geometry?.coordinates?.[1];


                    const lon =
                        properties.lon ||
                        place.geometry?.coordinates?.[0];


                    /* MAP URL */

                    const mapUrl =
                        `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;


                    /* GET IMAGE */

                    const imageUrl =
                        await getPlaceImage(
                            placeName,
                            cityName
                        );


                    /* CREATE CARD */

                    const card =
                        document.createElement("div");


                    card.className =
                        "place-card";


                    card.innerHTML = `

                        <img
                            class="place-image"
                            src="${imageUrl}"
                            alt="${escapeHTML(placeName)}"
                            onerror="this.src='https://placehold.co/600x400?text=TravelMate'"
                        >

                        <div class="place-content">

                            <h2 class="place-name">
                                ${escapeHTML(placeName)}
                            </h2>

                            <p class="category">
                                <strong>Category:</strong>
                                ${escapeHTML(category)}
                            </p>

                            <p class="address">
                                <strong>Address:</strong>
                                ${escapeHTML(address)}
                            </p>

                            <a
                                class="map-button"
                                href="${mapUrl}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                View on Map
                            </a>

                        </div>

                    `;


                    results.appendChild(card);

                }


                /* SCROLL TO RESULTS */

                setTimeout(function () {

                    results.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });

                }, 200);


            } catch (error) {

                console.error(error);


                status.style.display = "none";


                results.innerHTML = `

                    <div class="no-results">

                        <h2>Something went wrong</h2>

                        <p>
                            ${escapeHTML(error.message)}
                        </p>

                    </div>

                `;

            }

        }


        /* =========================================
           GET IMAGE FROM WIKIMEDIA COMMONS
           ========================================= */

        async function getPlaceImage(placeName, cityName) {

            try {

                const searchText =
                    `${placeName} ${cityName}`;


                const url =
                    `https://commons.wikimedia.org/w/api.php?` +
                    `action=query` +
                    `&generator=search` +
                    `&gsrsearch=${encodeURIComponent(searchText)}` +
                    `&gsrnamespace=6` +
                    `&gsrlimit=1` +
                    `&prop=imageinfo` +
                    `&iiprop=url` +
                    `&iiurlwidth=600` +
                    `&format=json` +
                    `&origin=*`;


                const response =
                    await fetch(url);


                if (!response.ok) {

                    throw new Error(
                        "Image search failed"
                    );

                }


                const data =
                    await response.json();


                if (
                    !data.query ||
                    !data.query.pages
                ) {

                    return getFallbackImage();

                }


                const pages =
                    Object.values(data.query.pages);


                if (
                    pages.length === 0 ||
                    !pages[0].imageinfo
                ) {

                    return getFallbackImage();

                }


                const image =
                    pages[0].imageinfo[0];


                return (
                    image.thumburl ||
                    image.url ||
                    getFallbackImage()
                );


            } catch (error) {

                console.log(
                    "Image not found:",
                    placeName
                );


                return getFallbackImage();

            }

        }


        /* =========================================
           FALLBACK IMAGE
           ========================================= */

        function getFallbackImage() {

            return "https://placehold.co/600x400?text=TravelMate";

        }


        /* =========================================
           ESCAPE HTML
           ========================================= */

        function escapeHTML(value) {

            return String(value)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");

        }

    </script>

</body>

</html>
